<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1808">
<title>Zonderbord · Spel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: speels, snel, onderling
   IDEA: een bordspel op tafel: grasveld met finishlijnen, dichte kaarten, scheids ernaast
   PICTURE: het grasbord, zo groot als het scherm toelaat, met kaart-fiches erop
   COLOUR and TYPE: avondgroen, goud accent, blauw (jij) tegen rood (tegenstander); Patrick Hand + Nunito
   LAYOUT: één telefoonscherm: spelersbalk, bord, jouw kaarten; cutscenes over alles heen */
:root{color-scheme:dark;--bg:#0b1607;--bar:#14260d;--bar2:#1b3312;--line:#2c4a1d;--ink:#f1f6ea;--soft:#9fb38f;--gold:#f5b324;--me:#4aa8ff;--op:#ff6161;--good:#3fbf4f;--bad:#e2524d;--paper:#f7f0e2}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:800 18px Nunito,sans-serif;color:var(--ink);background:var(--bar);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
h1,h2,.hand-f{font-family:"Patrick Hand",cursive;font-weight:400;margin:0;line-height:1}
.scr{position:fixed;inset:0;display:none;flex-direction:column;max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
.scr.on{display:flex}
.btn{height:54px;border-radius:14px;font-weight:900;font-size:17px;background:var(--bar2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1800}
.btn.white{background:#fff;border-color:#fff;color:#1f1f1f}
.btn svg{width:22px;height:22px}
.small{font-size:13px;color:var(--soft)}
.link{color:var(--soft);font-size:14px;text-decoration:underline;padding:8px}
/* logo + intro */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.logo{font:400 64px/1 "Patrick Hand",cursive;color:var(--ink);letter-spacing:1px;position:relative}
.logo b{color:var(--gold);font-weight:400}
.chk{height:14px;width:220px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px;border-radius:3px}
.fan{position:relative;height:150px;width:260px;margin:18px 0 6px}
.fan .back{position:absolute;left:50%;bottom:0;width:86px;margin-left:-43px;transform-origin:50% 120%;animation:fanin .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fanin{from{transform:rotate(0) translateY(40px);opacity:0}}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
/* card back */
.back{aspect-ratio:3/4;border-radius:10px;background:#1f3d12;border:3px solid #f1efe8;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.back::before{content:"";position:absolute;inset:5px;border-radius:6px;border:2px solid #3f6f22;background:repeating-linear-gradient(45deg,#24461a 0 6px,#1f3d12 6px 12px)}
.back::after{content:"Z";position:absolute;inset:0;display:grid;place-items:center;font:400 44px "Patrick Hand",cursive;color:var(--gold);text-shadow:0 2px 0 #0b1607}
/* home */
.top{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--bar2) center/cover;border:2px solid var(--me);flex:none;display:grid;place-items:center;font-weight:900}
.code{font:900 54px/1 Nunito,sans-serif;letter-spacing:10px;color:var(--gold);text-align:center;padding:16px 0 10px}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin:0 4px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px);opacity:.4}}
/* game header */
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pl{background:var(--bar);border:2px solid var(--line);border-radius:14px;padding:6px 10px;transition:border-color .25s,box-shadow .25s}
.pl.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.pl.me{--c:var(--me)}.pl.op{--c:var(--op);text-align:right}
.pl .nm{font-weight:900;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .st{display:flex;gap:8px;align-items:center;font-size:14px}.pl.op .st{justify-content:flex-end}
.hearts{color:var(--bad);letter-spacing:1px}.hearts i{font-style:normal}.hearts i.x{color:var(--line)}
.hit{animation:shake .5s}
.wall{display:inline-flex;gap:2px;align-items:center}.wall i{width:11px;height:9px;border-radius:2px;background:linear-gradient(#d9c7a4,#a8916a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}.wall i.x{background:var(--line);box-shadow:none;opacity:.6}
.wall.crack i{animation:crack .6s}@keyframes crack{30%{transform:translateY(-4px) rotate(-12deg)}60%{transform:translateY(2px) rotate(8deg)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.slok{color:var(--gold);font-weight:900;display:inline-flex;align-items:center;gap:2px}.slok svg{width:13px;height:16px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5)}}
.ib{width:38px;height:38px;border-radius:11px;background:var(--bar);border:2px solid var(--line);display:grid;place-items:center}
.ib svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.status{text-align:center;font-weight:800;font-size:14px;color:var(--soft);height:22px;margin:6px 0 2px;transition:color .2s}
.status.mine{color:var(--gold)}
/* board */
.stage{flex:1;display:grid;place-items:center;min-height:0}
.board{width:min(100%,calc((100dvh - 290px) * .8));min-width:240px;background:#27500A;border-radius:16px;padding:7px;border:3px solid #173404;display:flex;flex-direction:column;gap:5px;position:relative}
.fin{display:flex;align-items:center;gap:3px;border-radius:5px;transition:box-shadow .2s}
.fin.hl{box-shadow:0 0 0 3px var(--gold);animation:pulse 1s infinite;cursor:pointer}
.fin.flash{animation:flash .9s}
@keyframes flash{30%{box-shadow:0 0 0 6px var(--gold),0 0 30px var(--gold)}}
.post{width:6px;height:16px;background:#F1EFE8;border-radius:3px}
.flag{flex:1;height:16px;border-radius:3px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/8px 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.c{aspect-ratio:1;padding:1.5px;position:relative}
.c>div{width:100%;height:100%;border-radius:5px;overflow:hidden}
.c svg{display:block;width:100%;height:100%}
.c.mt>div{box-shadow:inset 0 -3px 0 #F1EFE8}.c.mb>div{box-shadow:inset 0 3px 0 #F1EFE8}
.c.hl::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--gold);opacity:.85;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
.toks{position:absolute;inset:0;pointer-events:none}
.tk{position:absolute;width:calc(100%/7);height:12.5%;transition:left .4s cubic-bezier(.3,1.3,.5,1),top .4s cubic-bezier(.3,1.3,.5,1);pointer-events:auto;cursor:pointer}
.tk.me{--c:var(--me)}.tk.op{--c:var(--op)}
.pc{position:absolute;left:11%;right:11%;top:-16%;bottom:7%;animation:drop .55s cubic-bezier(.3,1.4,.5,1);transition:transform .2s}
.pc .base{position:absolute;left:-10%;right:-10%;bottom:-9%;height:28%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--c) 85%,#fff) 0 30%,var(--c) 31% 58%,color-mix(in srgb,var(--c) 50%,#000) 60%);box-shadow:0 3px 5px rgba(0,0,0,.5)}
.pc .cd{position:absolute;left:3%;right:3%;top:0;bottom:11%;border-radius:7px;border:2.5px solid var(--c);background:#1f3d12 center/cover;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#000);overflow:hidden}
.pc .cd::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.4),transparent 38%);pointer-events:none}
.pc .gem{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--rf);box-shadow:0 0 0 1.5px #0f1a0a}
.tk.op .cd{background:repeating-linear-gradient(45deg,#2a5220 0 4px,#1f3d12 4px 8px);display:grid;place-items:center;font:400 17px/1 "Patrick Hand",cursive;color:var(--gold);text-shadow:0 1px 0 #000}
.tk.op .gem{display:none}.pc.r-e,.pc.r-l{box-shadow:none}
.tk.sel .pc{transform:translateY(-16%) scale(1.08)}.tk.sel .cd{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 10px 14px rgba(0,0,0,.55)}
.tk.die .pc{animation:die .5s forwards}
@keyframes drop{0%{transform:translateY(-90%) scale(1.3);opacity:0}65%{transform:translateY(6%) scale(1.05,.9);opacity:1}100%{transform:none}}
@keyframes die{to{transform:scale(1.6) rotate(25deg);opacity:0;filter:brightness(3)}}
/* hand */
.tray{display:flex;gap:7px;justify-content:center;align-items:center;padding-top:8px}
.mc{width:23%;max-width:92px;position:relative;transition:transform .2s,opacity .2s,filter .2s}
.mc.used{opacity:.45}.mc.next{opacity:.6;transform:scale(.88)}.mc.next.pick{transform:scale(.88)}
.qdiv{width:2px;align-self:stretch;margin:6px 2px;border-radius:2px;background:var(--line)}
.mc.shift{animation:shiftL .4s cubic-bezier(.2,1.2,.4,1)}.mc.enter{animation:enterQ .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes shiftL{from{transform:translateX(115%)}}@keyframes enterQ{from{transform:translateY(60px) scale(.6);opacity:0}}.mc.gone{opacity:.3;filter:grayscale(1)}
.mc.pick{transform:translateY(-10px)}.mc.pick .kc{outline:3px solid var(--gold);outline-offset:2px}
.mc .tag{position:absolute;top:42%;left:0;right:0;font:900 10px Nunito;color:#fff;background:rgba(0,0,0,.7);padding:2px 0;text-align:center;z-index:2}
.mc.empty{aspect-ratio:4/5.6;border:2px dashed var(--line);border-radius:14px}
.kc{--rf:#999;position:relative;border-radius:14px;padding:3px;background:var(--rf);box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.kin{border-radius:11px;overflow:hidden;background:#0f1a0a;position:relative}
.kpw{position:relative}
.kph{display:block;aspect-ratio:4/5;background:#333 center/cover}
.kft{position:absolute;left:0;right:0;bottom:0;padding:22px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.knm{display:block;font:21px/1 "Patrick Hand",cursive;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krr{display:block;font:900 10px/1.2 Nunito,sans-serif;color:var(--rt);margin-top:2px}
.kco{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--rf);display:grid;place-items:center;font:900 14px Nunito,sans-serif;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);box-shadow:0 0 0 2px #0f1a0a;z-index:1}
.r-c{--rf:linear-gradient(160deg,#e6ebef,#8a96a3);--rt:#d5dce2}
.r-r{--rf:linear-gradient(160deg,#ffcf80,#e0751a);--rt:#ffb257}
.r-e{--rf:linear-gradient(160deg,#dcaaff,#7b2cbf);--rt:#dcaaff;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 16px rgba(199,125,255,.45)}
.r-l{--rf:linear-gradient(135deg,#fff3b0,#f5b324 30%,#fffbe6 50%,#f5b324 70%,#a86f05);--rt:#ffd45e;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 20px rgba(245,179,36,.55)}
.r-l .kpw::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);animation:shine 3.4s infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(130%)}}
.kc.mini{border-radius:12px;padding:2.5px}.kc.mini .kin{border-radius:9.5px}.kc.mini .knm{font-size:15px}.kc.mini .krr{display:none}.kc.mini .kft{padding:16px 3px 4px}.kc.mini .kco{width:20px;height:20px;font-size:11px;top:4px;left:4px}
.kc.mid{width:112px}
.kc.big{width:min(300px,84vw);border-radius:20px;padding:5px}.kc.big .kin{border-radius:16px}.kc.big .knm{font-size:34px}.kc.big .krr{font-size:12px}.kc.big .kco{width:42px;height:42px;font-size:19px;top:10px;left:10px}
.ktx{padding:12px 14px 14px;text-align:center;color:var(--ink)}
.ktx .do{margin:0;font-weight:900;font-size:16px;line-height:1.35;color:#fff}
.ktx .ex{margin:8px 0 0;font-size:14px;line-height:1.35;color:var(--soft)}.ktx .ex b{color:var(--rt)}
.ktx .acts{margin-top:14px}
.panel{width:min(340px,90vw);background:var(--bar);border:2px solid var(--line);border-radius:20px;padding:18px 16px 16px;color:var(--ink)}
.panel h2{font-size:34px;color:var(--gold);text-align:center}
.panel .rl{font-size:14px}
.bar{display:flex;gap:8px;margin-top:8px}.bar .btn{height:46px;font-size:15px}
/* draft */
.pool{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-content:center;padding:4px}
.slot{perspective:600px}
.slot .back{transition:transform .2s,opacity .3s}
.slot.can .back{animation:wob 2.4s infinite}
.slot.can:nth-child(odd) .back{animation-delay:.6s}
@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-3px)}}
.slot.tk-me .back,.slot.tk-op .back{opacity:.18;animation:none}
.slot.tk-me .back{box-shadow:0 0 0 3px var(--me)}.slot.tk-op .back{box-shadow:0 0 0 3px var(--op)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:rgba(4,9,2,.86)}
.ov.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.big{width:min(300px,84vw);background:var(--cc);border-radius:16px;padding:8px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.in{background:var(--paper) repeating-linear-gradient(0deg,transparent 0 15px,#e8dcc6 15px 16px),repeating-linear-gradient(90deg,transparent 0 15px,#e8dcc6 15px 16px);background-blend-mode:multiply;border-radius:10px;padding:10px;color:#1d1d1d;text-align:center}
.pill{display:inline-block;background:#fff;color:var(--cc);font:26px/1 "Patrick Hand",cursive;padding:5px 16px 3px;border-radius:999px;filter:brightness(.85)}
.big .ph{aspect-ratio:185/200;border-radius:9px;background:#ddd center/cover;margin:8px 0;position:relative}
.big .cost{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:var(--gold);border-radius:999px;font:900 14px Nunito;padding:2px 9px}
.do{margin:0;font-weight:900;font-size:15px;line-height:1.3;color:var(--cc);filter:brightness(.7)}
.ex{margin:6px 0 0;font-size:14px;line-height:1.3}.ex b{color:#5a3fb0}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{height:48px;font-size:15px}
.rl{text-align:left;margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.4}.rl li{margin-bottom:6px}
/* cutscenes */
.cut{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(3,7,2,.9);overflow:hidden}
.cut.on{display:grid}.cut.solid{background:var(--bg)}
.cut .ttl{font:400 clamp(48px,15vw,76px)/1 "Patrick Hand",cursive;color:var(--gold);text-shadow:0 4px 0 #3a2500;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(3) rotate(-8deg);opacity:0}}
.cut .sub{font-weight:800;color:var(--ink);text-align:center;margin-top:10px;animation:fade .4s .35s both;max-width:300px}
.vs{display:flex;align-items:center;gap:14px}
.vs .side{width:120px;text-align:center}
.vs .side .back,.vs .side .kc{width:112px;margin:0 auto}
.vs .l{animation:fromL .55s cubic-bezier(.2,1.3,.4,1) both}.vs .r{animation:fromR .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes fromL{from{transform:translateX(-120vw) rotate(-20deg)}}
@keyframes fromR{from{transform:translateX(120vw) rotate(20deg)}}
.vs .x{font:400 54px "Patrick Hand",cursive;color:var(--gold);animation:slam .5s .45s both}
.face{aspect-ratio:3/4;border-radius:10px;background:var(--cc);padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.face i{display:block;height:78%;border-radius:7px;background:#ddd center/cover}
.face span{display:block;font:17px/1.4 "Patrick Hand",cursive;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .who{font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip{animation:flip .7s both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}60%{transform:rotateY(0) scale(1.1)}100%{transform:none}}
.deckrow{display:flex;gap:8px;justify-content:center;margin-top:16px}
.deckrow .kc{width:74px}.deckrow .knm{font-size:15px}.deckrow .krr{font-size:8px}.deckrow .kco{width:20px;height:20px;font-size:11px}
.deckrow .face:nth-child(2){animation-delay:.15s}.deckrow .face:nth-child(3){animation-delay:.3s}.deckrow .face:nth-child(4){animation-delay:.45s}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.sheet.on{display:flex;animation:up .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet>div{width:100%;max-width:496px;background:var(--bar);border:2px solid var(--gold);border-radius:18px;padding:12px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.drk{display:grid;grid-template-columns:minmax(0,1fr) 66px minmax(0,1fr);gap:10px;align-items:center}
.ring{width:66px;height:66px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 22px Nunito}
.vb{height:50px;border-radius:13px;font-weight:900;color:#fff}
.vb.no{background:var(--bad)}.vb.ok{background:var(--good)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;width:min(330px,90vw);animation:fade .3s .8s both}
.res .btn{height:50px;font-size:15px}
.res .me{background:var(--me);border-color:var(--me);color:#06223f}.res .op{background:var(--op);border-color:var(--op);color:#3a0606}
.opd{background:var(--bar);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:14px;font-size:14px;width:min(330px,90vw);text-align:center;animation:fade .3s .7s both}
.opd b{color:var(--gold)}
.mc,.tk{touch-action:none}
#ghost{position:fixed;z-index:50;pointer-events:none;width:84px;transform:translate(-50%,-75%) rotate(-5deg) scale(1.08);filter:drop-shadow(0 12px 14px rgba(0,0,0,.55));display:none}
#ghost.tok{width:44px;height:58px;transform:translate(-50%,-70%) rotate(-4deg)}#ghost.tok .pc{inset:0 0 10% 0;animation:none;--c:var(--gold)}
.c.over::after{inset:12%;opacity:1;animation:none;background:color-mix(in srgb,var(--gold) 70%,transparent)}
.mc.dragging{opacity:.3}
.arena{position:relative;width:300px;height:210px}
.arena .side{position:absolute;top:8px;width:112px;text-align:center}
.arena .w{left:14px;z-index:2}.arena .l{right:14px}
.arena .who{font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena .back{width:112px}
.arena .w.hit{animation:hitL 1s cubic-bezier(.5,0,.3,1) .3s both}
.arena .l.ko{animation:ko 1.1s cubic-bezier(.3,.5,.4,1) .68s both}

function newGame(code,u,name,kind){return {code,kind:kind||'',players:[u],names:{[u]:name},phase:'wait',pool:enc(shuffle(KEYS)),taken:{},pickTurn:u,turn:u,lives:{[u]:LIVES},wall:{[u]:WALL},board:{},gone:[],drink:null,battle:null,ev:{n:0,type:'new'},winner:null,created:Date.now()}}

 if(g.kind==='ref'&&!g.ref){ev(g,'join',{by:u});return}
 g.phase='draft';g.pickTurn=g.players[0];ev(g,'draft')}
function ev(g,type,x={}){g.ev={n:(g.ev?.n||0)+1,type,...x}}
function A_pick(g,h,u,slot){
 if(g.phase!=='draft'||g.pickTurn!==u)throw 'Niet jouw beurt';if(g.taken[slot])throw 'Al gepakt';if(h.deck.length>=DECK)throw 'Je deck is vol';
 h.deck.push(dec(g.pool)[slot]);g.taken[slot]=u;
 const cnt=x=>Object.values(g.taken).filter(v=>v===x).length,o=other(g,u);
 if(cnt(u)>=DECK&&cnt(o)>=DECK){g.phase='play';g.turn=g.players[1];ev(g,'start');return}

function endTurn(g){g.turn=other(g,g.turn);g.turnN=(g.turnN||0)+1}
function queueOf(g,h){const onB=new Set(Object.values(g.board).map(b=>b.t)),gi={};(g.gone||[]).forEach((t,i)=>gi[t]=i);const fresh=[],ret=[],board=[];
 for(const k of h.deck){const ts=Object.keys(h.placed).filter(t=>h.placed[t]===k);if(ts.some(t=>onB.has(t))){board.push(k);continue}const d=ts.filter(t=>t in gi).map(t=>gi[t]);if(d.length)ret.push([Math.max(...d),k]);else fresh.push(k)}
 ret.sort((a,b)=>a[0]-b[0]);return {queue:[...fresh,...ret.map(x=>x[1])],board,pending:g.drink&&h.placed[g.drink.t]||null}}
const PLAY=2;
function playable(g,h,k){const q=queueOf(g,h);return q.queue.indexOf(k)>-1&&q.queue.indexOf(k)<PLAY&&q.pending!==k}
function free(g){return g.phase==='play'&&!g.drink&&!g.battle}
const GIFT_ROUNDS=10;
const discOf=(h,k,g)=>{const d=(h.disc||{})[k];if(!d)return [];const now=g&&g.turnN||0;return (Array.isArray(d)?d:[]).filter(x=>x>now)};
const costOf=(h,k,g)=>Math.max(0,CARDS[k].s-discOf(h,k,g).length);
const giftLeft=(h,k,g)=>{const d=discOf(h,k,g);if(!d.length)return 0;return Math.ceil((Math.max(...d)-(g.turnN||0))/2)};
function A_place(g,h,u,key,cell){
 if(!free(g)||g.turn!==u)throw 'Niet jouw beurt';
 const c=CARDS[key];if(!h.deck.includes(key)||!playable(g,h,key))throw 'Je kunt alleen de eerste 2 kaarten van je deck inzetten';
 if(rc(cell)[0]!==home(g,u)||g.board[cell])throw 'Kies een leeg vakje op je startrij';
 const t=rid();h.placed[t]=key;
 const cost=costOf(h,key,g),isFree=g.free&&g.free[u];
 if(isFree||cost===0){if(isFree)g.free[u]=false;g.board[cell]={o:u,t};ev(g,'freeplace',{by:u});if(checkBattle(g,cell))return;endTurn(g);return}
 g.drink={u,cost,at:Date.now(),cell,t};ev(g,'place',{by:u});
}
function neighbours(cell){const[r,c]=rc(cell);return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&a<8&&b>=0&&b<7).map(([a,b])=>a*7+b)}
function checkBattle(g,cell){const me=g.board[cell];if(!me)return false;for(const n of neighbours(cell)){const o=g.board[n];if(o&&o.o!==me.o){g.battle={id:rid(),a:{cell,o:me.o,t:me.t},d:{cell:n,o:o.o,t:o.t},show:{}};ev(g,'battle');return true}}return false}
function moves(g,u,cell,key){const[r,c]=rc(cell),d=dir(g,u),out=[],off=x=>x<0||x>7;
 if(off(r+d))out.push('fin');else if(!g.board[(r+d)*7+c]){out.push((r+d)*7+c);if(fx(key).run2){if(off(r+2*d))out.push('fin');else if(!g.board[(r+2*d)*7+c])out.push((r+2*d)*7+c)}}

function loseLife(g,u,n){g.lives[u]=Math.max(0,g.lives[u]-n);if(!g.lives[u]){g.phase='over';g.winner=other(g,u)}}

 const extra=f==='atje2'?`${N[o]} neemt 2 atjes!`:f==='atje1'?`${N[o]} neemt 1 atje!`:'';return {dmg,lost:dmg,txt,extra}}
function A_move(g,h,u,from,to){
 if(!free(g)||g.turn!==u)throw 'Niet jouw beurt';const tk=g.board[from];if(!tk||tk.o!==u)throw 'Niet jouw kaart';if(!moves(g,u,from,h.placed[tk.t]).includes(to))throw 'Daar mag je niet heen';
 if(to==='fin'){const r=doFinish(g,from,tk,h.placed[tk.t]);ev(g,'finish',{by:u,dmg:r.dmg,lost:r.lost,txt:r.txt,extra:r.extra});if(g.phase==='over')return;endTurn(g);return}

}
function A_drink(g,u,ok,at){
 if(!g.drink||(at&&g.drink.at!==at))return;const d=g.drink;g.drink=null;
 if(ok){g.board[d.cell]={o:d.u,t:d.t};ev(g,'drinkok',{by:d.u});if(checkBattle(g,d.cell))return;endTurn(g);return}
 loseLife(g,d.u,1);ev(g,'drinkfail',{by:d.u});if(g.phase==='over')return;g.turn=d.u;endTurn(g);
}
function A_reveal(g,h,u){const b=g.battle;if(!b||b.show[u])return;const side=b.a.o===u?b.a:b.d.o===u?b.d:null;if(side&&h.placed[side.t])b.show[u]=h.placed[side.t]}
function stepFwd(g,o,cell,n,key){let moved=0,fin='';for(let i=0;i<n;i++){const[r,c]=rc(cell),nr=r+dir(g,o);if(nr<0||nr>7){const f=doFinish(g,cell,g.board[cell],key);fin=`Finish! ${f.txt} ${f.extra}`;break}const nx=nr*7+c;if(g.board[nx])break;g.board[nx]=g.board[cell];delete g.board[cell];cell=nx;moved++}return {moved,fin}}
function A_battle(g,res){
 const b=g.battle;if(!b)return;g.gone=g.gone||[];const N=u=>g.names[u],sh=b.show||{};
 const K=x=>{if(g.board[x.cell]&&g.board[x.cell].t===x.t){delete g.board[x.cell];g.gone.push(x.t)}};
 const out={res,a:b.a.o,d:b.d.o,kind:'draw',wo:b.a.o,lo:b.d.o,wk:sh[b.a.o]||null,lk:sh[b.d.o]||null,steps:0,title:'',lines:[]};
 if(res==='a'||res==='d'){
  const W=res==='a'?b.a:b.d,L=res==='a'?b.d:b.a,wk=sh[W.o]||null,w=fx(wk).w;
  Object.assign(out,{wo:W.o,lo:L.o,wk,lk:sh[L.o]||null,title:`${N(W.o)} wint!`,kind:'ko'});
  if(w==='move3'){let cell=W.cell,n=0,fin='';
   for(let i=0;i<3;i++){const[r,c]=rc(cell),nr=r+dir(g,W.o);if(nr<0||nr>7){const f=doFinish(g,cell,g.board[cell],wk);fin=`Finish! ${f.txt} ${f.extra}`;break}const nx=nr*7+c;if(g.board[nx])break;g.board[nx]=g.board[cell];delete g.board[cell];cell=nx;n++}
   out.kind='move';out.steps=n;out.lines.push('Geen verliezer! Niemand gaat dood.');out.lines.push(n?`Sneaky melvin gaat ${n} ${n===1?'plekje':'plekjes'} verder.`:'Sneaky melvin staat vast, er staat iets voor hem.');if(fin)out.lines.push(fin)}

  else if(w==='ko2'){K(L);out.lines.push(`De kaart van ${N(L.o)} is uitgeschakeld.`);const st=stepFwd(g,W.o,W.cell,2,wk);out.lines.push(st.moved?`Windkop Rick waait ${st.moved} ${st.moved===1?'stap':'stappen'} naar voren!`:'Windkop Rick wil verder waaien, maar staat vast.');if(st.fin)out.lines.push(st.fin)}

  if(w==='give5')out.lines.push(`Dk'tje: ${N(W.o)} mag 5 slokken uitdelen!`);

 }else if(res==='both'){K(b.a);K(b.d);out.kind='both';out.title='Allebei dood';out.lines.push('Beide kaarten gaan van het bord en sluiten achteraan aan.')}

function A_gift(g,h,u,key){if(!g.gift||!g.gift[u])throw 'Geen cadeautje';if(!h.deck.includes(key))throw 'Niet jouw kaart';h.disc=h.disc||{};const cur=discOf(h,key,g);cur.push((g.turnN||0)+GIFT_ROUNDS*2);h.disc[key]=cur;g.gift[u]-=1;if(g.gift[u]<=0)delete g.gift[u];ev(g,'gift',{by:u})}

}

/* ====== 9. KLIKKEN ====== */
function openOv(h,lock){$('ovIn').innerHTML=h;$('ov').classList.add('on');$('ov').dataset.lock=lock?'1':'';$('ov').dataset.battle=''}
$('ov').addEventListener('click',e=>{const t=e.target;
 const nb=t.closest('[data-new]');if(nb){$('ov').classList.remove('on');newOnline(nb.dataset.new).catch(e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'Geen toegang: zijn de nieuwe Firestore-regels gepubliceerd?':'Potje maken mislukt')});return}
 const gb=t.closest('[data-gift]');if(gb){const k=gb.dataset.gift;$('ov').classList.remove('on');S.giftOpen=false;act((g,h,u)=>A_gift(g,h,u,k));toast(`${CARDS[k].n} kost 10 rondes lang 1 slok minder!`);return}
 if(t.closest('[data-b]')){if(!JUDGE())return;const r=t.closest('[data-b]').dataset.b;$('ov').classList.remove('on');act(g=>A_battle(g,r));return}
 const a=t.closest('[data-a]');if(a){if(a.dataset.a==='close')$('ov').classList.remove('on');if(a.dataset.a==='place'){S.placing=a.dataset.k;S.sel=null;$('ov').classList.remove('on');render()}return}
 if(t===$('ov')&&!$('ov').dataset.lock)$('ov').classList.remove('on');
});
$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b||!DRINKJ())return;const at=S.g.drink?.at;act(g=>A_drink(g,null,b.dataset.d==='1',at))});
$('pool').addEventListener('click',async e=>{const s=e.target.closest('.slot.can');if(!s||pickBusy||REF())return;pickBusy=true;const slot=+s.dataset.slot;
 const key=dec(S.g.pool)[slot];s.classList.remove('can');s.classList.add('picked');
 if(mode==='local'){await revealPick(key,s);pickBusy=false;act((g,h,u)=>A_pick(g,h,u,slot));return}
 const ok=await act((g,h,u)=>A_pick(g,h,u,slot));
 if(ok)await revealPick(key,s);else{s.classList.remove('picked');s.classList.add('can')}
 pickBusy=false;render();
});
$('tray').addEventListener('click',e=>{if(noClick)return;const b=e.target.closest('.mc[data-k]');if(!b)return;const k=b.dataset.k,c=CARDS[k],g=S.g;
 const can=g.phase==='play'&&free(g)&&g.turn===S.me&&playable(g,S.h,k);const q=g.phase==='play'?queueOf(g,S.h):null,qi=q?q.queue.indexOf(k):-1;
 const btn=can?`<button class="btn gold" data-a="place" data-k="${k}">Neerzetten</button>`:'';
 openOv(cardHTML(k,'big',`<div class="ktx"><p class="do">${esc(c.d)}</p>${c.e?`<p class="ex"><b>Extra:</b> ${esc(c.e)}</p>`:''}<p class="ex">Finish: tegenstander -${k==='lillenn'?2:1} ${k==='lillenn'?'levens':'leven'}</p><p class="ex">${g.free&&g.free[S.me]?'Gratis! Geen slokken nodig':(costOf(S.h,k,S.g)<c.s?`Kost ${costOf(S.h,k,S.g)} ${costOf(S.h,k,S.g)===1?'slok':'slokken'} (cadeautje van Jacko: -${c.s-costOf(S.h,k,S.g)}, nog ${giftLeft(S.h,k,S.g)} ${giftLeft(S.h,k,S.g)===1?'ronde':'rondes'})`:`Kost ${c.s} slokken om neer te zetten`)}</p>${q&&qi>=PLAY?`<p class="ex" style="color:var(--gold)">Nog ${qi-PLAY+1} ${qi-PLAY+1===1?'kaart':'kaarten'} tot je deze kunt inzetten</p>`:''}${q&&qi===-1?`<p class="ex" style="color:var(--gold)">Staat op het bord</p>`:''}<div class="acts"><button class="btn" data-a="close">Sluiten</button>${btn}</div></div>`,costOf(S.h,k,S.g)));
});
$('grid').addEventListener('click',e=>{if(noClick)return;const g=S.g;if(!g||g.phase!=='play')return;
 const tk=e.target.closest('.tk');
 if(tk){const cell=+tk.dataset.cell;if(REF())return toast('Kaarten van de spelers zijn geheim');if(g.board[cell]?.o!==S.me)return toast('Kaart van de tegenstander. Geheim!');if(!(free(g)&&g.turn===S.me))return;S.placing=null;S.sel=S.sel===cell?null:cell;render();return}
 const c=e.target.closest('.c');if(!c||!c.classList.contains('hl'))return;const cell=fromVis(+c.dataset.v);
 if(S.placing){const k=S.placing;S.placing=null;act((g,h,u)=>A_place(g,h,u,k,cell))}
 else if(S.sel!=null){const f=S.sel;S.sel=null;act((g,h,u)=>A_move(g,h,u,f,cell))}
});
$('finTop').addEventListener('click',()=>{if(!$('finTop').classList.contains('hl'))return;const f=S.sel;S.sel=null;act((g,h,u)=>A_move(g,h,u,f,'fin'))});
$('bPass').onclick=()=>{S.sel=null;S.placing=null;act((g,h,u)=>A_pass(g,u))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('ov').classList.remove('on');S.sel=null;S.placing=null;render()}});

/* ====== 9a. EFFECTEN ====== */
const GRASS=['#97C459','#7FAE45','#c8e39a','#5e8f2c','#f1efe8'];
function burst(x,y,colors,n=16,spread=70,cls=''){const L=$('fxl');for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=spread*(.4+Math.random()*.8),p=document.createElement('i');p.className='pt '+cls;p.style.left=x+'px';p.style.top=y+'px';p.style.background=colors[i%colors.length];p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-20)+'px');p.style.setProperty('--r',(Math.random()*540-270)+'deg');L.appendChild(p);setTimeout(()=>p.remove(),800)}}
function shock(x,y,color){const r=document.createElement('i');r.className='shock';r.style.left=x+'px';r.style.top=y+'px';r.style.setProperty('--c',color);$('fxl').appendChild(r);setTimeout(()=>r.remove(),650)}
const center=el=>{const b=el.getBoundingClientRect();return [b.left+b.width/2,b.top+b.height/2]};
function thud(){const b=document.querySelector('.board');b.classList.remove('thud');void b.offsetWidth;b.classList.add('thud')}
const TCOL={c:'#d5dce2',r:'#ffb257',e:'#c77dff',l:'#f5b324'};
function revealPick(key,fromEl){return new Promise(res=>{
 const t=tier(key),R=$('rev');R.style.setProperty('--rc',TCOL[t]);
 R.innerHTML=`<div class="rays"></div><div class="glow"></div><div class="wrap"><div class="c3"><div><div class="back"></div></div><div class="fr">${cardHTML(key,'mid')}</div></div><div class="tl">${TIER[t]}!</div><div class="nm2">${esc(CARDS[key].n)}</div></div>`;
 R.classList.add('on');
 setTimeout(()=>{const [x,y]=center(R.querySelector('.c3'));burst(x,y,[TCOL[t],'#fff',TCOL[t]],t==='l'?40:t==='e'?28:18,t==='l'?190:140)},560);
 setTimeout(()=>{const w=R.querySelector('.wrap'),slot=[...$('tray').children].find(c=>c.classList.contains('empty'))||$('tray');const [tx,ty]=center(slot),[cx,cy]=center(R.querySelector('.c3'));w.style.transform=`translate(${tx-cx}px,${ty-cy}px) scale(.45)`;w.style.opacity='.2';R.querySelector('.rays').style.opacity=0},t==='l'?2100:1700);
 setTimeout(()=>{R.classList.remove('on');R.innerHTML='';res()},t==='l'?2600:2200);
})}
let pickBusy=false;

/* ====== 9b. SLEPEN ====== */
let drag=null,noClick=false;
const myFree=()=>!REF()&&S.g&&S.g.phase==='play'&&free(S.g)&&S.g.turn===S.me;
$('tray').addEventListener('pointerdown',e=>{const m=e.target.closest('.mc[data-k]');if(!m||!myFree()||!playable(S.g,S.h,m.dataset.k))return;drag={type:'card',k:m.dataset.k,x:e.clientX,y:e.clientY,on:false,src:m}});
$('grid').addEventListener('pointerdown',e=>{const t=e.target.closest('.tk.me');if(!t||!myFree())return;drag={type:'tok',cell:+t.dataset.cell,x:e.clientX,y:e.clientY,on:false,src:t}});
function overTarget(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const c=el.closest('.c.hl');if(c)return c;const f=el.closest('#finTop.hl');return f||null}
document.addEventListener('pointermove',e=>{if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.on=true;const gh=$('ghost');
  if(drag.type==='card'){S.placing=drag.k;S.sel=null;gh.className='';gh.innerHTML=cardHTML(drag.k,'mini')}
  else{S.sel=drag.cell;S.placing=null;const k=S.h.placed[S.g.board[drag.cell].t];gh.className='tok';gh.innerHTML=`<div class="pc r-${tier(k)}"><span class="base"></span><div class="cd" style="${img(k)}"></div><b class="gem"></b></div>`}
  render();gh.style.display='block';const src=drag.type==='card'?$('tray').querySelector(`.mc[data-k="${drag.k}"]`):null;if(src)src.classList.add('dragging')}
 const gh=$('ghost');gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';
 document.querySelectorAll('.c.over').forEach(c=>c.classList.remove('over'));const t=overTarget(e.clientX,e.clientY);if(t&&t.classList.contains('c'))t.classList.add('over');
});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!d.on)return;noClick=true;setTimeout(()=>noClick=false,80);
 $('ghost').style.display='none';document.querySelectorAll('.c.over').forEach(c=>c.classList.remove('over'));
 const t=overTarget(e.clientX,e.clientY);
 if(t&&t.id==='finTop'&&d.type==='tok'){S.sel=null;act((g,h,u)=>A_move(g,h,u,d.cell,'fin'));return}
 if(t&&t.classList.contains('c')){const cell=fromVis(+t.dataset.v);S.placing=null;S.sel=null;
  if(d.type==='card')act((g,h,u)=>A_place(g,h,u,d.k,cell));else act((g,h,u)=>A_move(g,h,u,d.cell,cell));return}
 S.placing=null;S.sel=null;render();
});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;$('ghost').style.display='none';S.placing=null;S.sel=null;render()}});

/* ====== 10. START ====== */
(async()=>{
 FB=await loadFirebase();
 if(!FB){$('loginNote').textContent='Online spelen (met code en scheids) kan op de Zonderplan-website. Hier kun je oefenen op 1 telefoon.';return}
 FB.A.onAuthStateChanged(FB.auth,u=>{user=u;if(mode==='local')return;if(u)goHome();else show('sLogin')});
})();
</script>
