<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a046">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zonderbord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Opzet: groene kopbalk (kleur per spel), witte kaarten op lichtgrijs, teambalk onderin, menu schuift van links in */
:root{
 --top:#00a046;--act:var(--top);--bg:#edf1f5;--card:#fff;--ink:#0b1d44;--mu:#66748c;--line:#e2e7ee;--gold:#f5b301;
 --win:#00a046;--loss:#d93a3a;--draw:#8a96a8;
 --acbg:color-mix(in srgb,var(--top) 12%,var(--card));
 --shadow:0 1px 2px rgba(11,29,68,.08),0 3px 10px rgba(11,29,68,.05);
 --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
 --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light;padding-top:env(safe-area-inset-top,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#141c2d;--ink:#e9eef8;--mu:#8e9bb2;--line:#243049;--act:color-mix(in srgb,var(--top) 62%,#fff);--acbg:color-mix(in srgb,var(--top) 22%,var(--card));--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#141c2d;--ink:#e9eef8;--mu:#8e9bb2;--line:#243049;--act:color-mix(in srgb,var(--top) 62%,#fff);--acbg:color-mix(in srgb,var(--top) 22%,var(--card));--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
:root[data-game="fifa"]{--top:#1f4fd6}
:root[data-game="voetvolley"]{--top:#e2570b}
:root[data-game="clash"]{--top:#7b2fd0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:30}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
small{display:block;font-weight:400;color:var(--mu);font-size:12px}

/* kopbalk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top);color:#fff;height:58px;display:grid;grid-template-columns:58px 1fr 58px;align-items:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.bar h1{margin:0;text-align:center;font:800 25px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;margin:auto;border:0;background:none;color:#fff;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.14)}
main{max-width:680px;margin:0 auto;padding-block:12px calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:relative}

/* kaarten */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 0}
.ch h2,.ch h3{margin:0;font:700 24px/1.1 var(--fd);color:var(--ink)}
.ch h3{font-size:21px}
.sub{color:var(--mu);font-size:15px;margin-top:3px}
.cfoot{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:15px;font:700 19px var(--fd);color:var(--ink);cursor:pointer}
.cfoot svg{color:var(--act)}
.cfoot:hover{background:var(--bg)}
.pad{padding:16px}

/* volgende wedstrijd */
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:22px 16px 18px;align-self:flex-start}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;background:none;border:0;cursor:pointer;padding:0}
.side b{font:700 19px/1.15 var(--fd);color:var(--ink);overflow-wrap:anywhere}
.mid{font:800 34px/1 var(--fd);color:var(--ink);min-width:70px}
.mid small{font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.dots{display:flex;gap:7px;padding-top:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--top)}

/* teamlogo */
.crest{width:var(--s,56px);height:var(--s,56px);border-radius:50%;display:inline-grid;place-items:center;flex:none;color:#fff;font:800 calc(var(--s,56px)*.38)/1 var(--fd);letter-spacing:.02em;background:radial-gradient(circle at 32% 25%,hsl(var(--h) 72% 60%),hsl(var(--h) 66% 34%));box-shadow:inset 0 0 0 calc(var(--s,56px)*.05) rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.18)}

/* odds */
.ob{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px;display:flex}
.ob i{display:block;height:100%;background:var(--top)}
.ob em{display:block;height:100%;background:var(--gold)}
.odds{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);margin-top:6px}
.odds b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.inf{font-size:14px;color:var(--mu);margin-top:6px}

/* nieuws-achtige kaart */
.news{display:flex;gap:14px;align-items:center}
.nicon{width:46px;height:46px;flex:none;display:grid;place-items:center;color:var(--top)}
.round{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--top);color:#fff;display:grid;place-items:center;cursor:pointer}
.nbody{margin:14px 16px 0;border-top:1px solid var(--line);padding:14px 0 16px;font-size:19px;line-height:1.35}
.nbody b{font-weight:700}

/* wedstrijdregels */
.m{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.m.c{cursor:pointer}
.mr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.t{display:flex;align-items:center;gap:9px;font-weight:600;min-width:0}
.t>span{min-width:0;overflow-wrap:anywhere}
.t.r{flex-direction:row-reverse;text-align:right}
.t.w{font-weight:800}
.t.l{color:var(--mu)}
.sc{font:800 21px/1 var(--fd);background:var(--ink);color:var(--card);padding:7px 10px;border-radius:8px;min-width:66px;text-align:center;font-variant-numeric:tabular-nums}
.sc.o{background:var(--acbg);color:var(--act)}
.mm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin-top:8px}
.chip{display:inline-block;background:var(--bg);border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px;font-weight:600;color:var(--mu)}
.pill{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;color:#fff;font:800 13px var(--fd)}
.pill.W{background:var(--win)}.pill.V{background:var(--loss)}.pill.G{background:var(--draw)}

/* koppen */
.sec{font:700 15px var(--fd);color:var(--mu);text-transform:uppercase;letter-spacing:.09em;margin:22px 4px 10px}
.sec:first-child{margin-top:4px}
.ptitle{font:800 32px/1.05 var(--fd);margin:6px 4px 14px;color:var(--ink);text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--act);font:700 16px var(--fb);cursor:pointer;padding:4px 4px 6px}

/* tabellen */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--mu);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:left}
td.n{font-weight:600}
td.n .t{gap:8px}
td.n .t>span{white-space:nowrap}
th,td{padding-left:5px;padding-right:5px}
tr.c{cursor:pointer}
tr.c:hover td{background:var(--bg)}
td.p{font-weight:800;color:var(--act)}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bg);font-size:13px;font-weight:700}
.rkD{background:#38bdf8;color:#04283d}.rkG{background:#f5b301;color:#3a2a00}.rkS{background:#c0c7ce;color:#222}.rkB{background:#cd7f32;color:#fff}
.bd{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bc,var(--line));color:var(--bc,var(--mu));border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--card);white-space:nowrap}

/* teams */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tc{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;cursor:pointer;color:var(--ink)}
.tc b{font:700 19px/1.1 var(--fd);overflow-wrap:anywhere}
.tc>span:not(.crest){color:var(--mu);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.li>div{flex:1;min-width:0}
.li b{display:block;font:700 19px/1.15 var(--fd)}
.li>div>span{color:var(--mu);font-size:14px}
.li svg{color:var(--mu);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}
.stat b{display:block;font:800 28px/1 var(--fd);color:var(--act);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mu)}
.thero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px}
.thero h2{margin:0;font:800 32px/1 var(--fd)}
.rg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
.rc{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.win{background:linear-gradient(135deg,var(--top),color-mix(in srgb,var(--top) 60%,#000));color:#fff;border-radius:14px;padding:16px;text-align:center;font:800 22px var(--fd);margin-bottom:12px}

/* formulieren */
.form{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px 16px 16px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--top);color:#fff;font:700 18px var(--fd);letter-spacing:.03em;cursor:pointer}
.go.s{margin:0;padding:7px 12px;width:auto;font-size:15px}
.go.alt{background:var(--bg);color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.pick input{width:auto}
.sin{width:54px!important;padding:7px!important;text-align:center}
.ic{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--ink);cursor:pointer;font-size:13px;margin-left:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .ic{margin:0}
.empty{color:var(--mu);text-align:center;padding:28px 16px}
.note{color:var(--mu);font-size:13px;text-align:center;margin:10px 0}

/* teambalk onderin */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.dock::-webkit-scrollbar{display:none}
.dk{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mu);font-size:14px;cursor:pointer;padding:4px 2px;border-radius:10px}
.dk .nm,.dk small{max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk small{font-size:11px;margin-top:-5px;color:var(--mu)}
.dk{gap:5px}
.dk.on{color:var(--ink);font-weight:700}
.dk.on .crest,.dk.on .homei{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--top)}
.dsep{flex:none;width:1px;background:var(--line);margin:4px 6px}
.homei{width:48px;height:48px;border-radius:50%;background:var(--acbg);color:var(--act);display:grid;place-items:center}

/* zijmenu */
.scrim{position:fixed;inset:0;background:rgba(5,12,30,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(310px,86vw);background:var(--card);z-index:41;transform:translateX(-104%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.dh{background:var(--top);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center}
.dh b{color:#fff;font:800 28px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase}
.dh small{color:rgba(255,255,255,.8);font-size:14px;margin-top:4px}
.dl{padding:18px 18px 6px max(18px,env(safe-area-inset-left,0px));font:700 13px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.di{display:flex;align-items:center;gap:14px;width:100%;padding:13px 18px 13px max(18px,env(safe-area-inset-left,0px));background:none;border:0;color:var(--ink);font:600 17px var(--fb);cursor:pointer;text-align:left}
.di:hover{background:var(--bg)}
.di.on{background:var(--acbg);color:var(--act)}
.di svg{flex:none}
.gdot{width:14px;height:14px;border-radius:50%;flex:none}
.di .chk{margin-left:auto}

/* toevoegen: tabbladen en teambeheer */
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{flex:1 1 auto;border:0;background:none;padding:10px 8px;border-radius:9px;font:700 16px var(--fd);color:var(--mu);cursor:pointer;white-space:nowrap}
.seg button.sel{background:var(--top);color:#fff}
img.crest{object-fit:cover;background:var(--card);padding:0}
img.crest.lg{object-fit:contain;border-radius:0;box-shadow:none;background:none}
.ted{display:flex;gap:16px;align-items:center;padding-top:14px}
.logoPick{width:104px;height:104px;flex:none;border:2px dashed var(--line);border-radius:20px;background:var(--bg);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;color:var(--mu)}
.logoPick img{width:100%;height:100%;object-fit:contain}
.logoPick img.ph{object-fit:cover}
.lp-empty{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 8px}
.pl>span{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.pav{width:42px;height:42px;border-radius:50%;border:0;padding:0;overflow:hidden;background:var(--acbg);color:var(--act);font:800 16px var(--fd);cursor:pointer;flex:none;display:grid;place-items:center}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;padding:16px}
.sq{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.sq{background:none;border:0;color:var(--ink);font-family:inherit;cursor:pointer;padding:0}
.sq .pav{width:66px;height:66px;font-size:24px;cursor:inherit}
.pav.xl{width:104px;height:104px;font-size:38px;cursor:default}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.chks input{width:auto}
.li .ic{flex:none}
.rhead{display:flex;align-items:center;gap:10px}
.rn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.rn b{font:700 20px/1.1 var(--fd);margin-right:2px;overflow-wrap:anywhere}
img.club{width:24px;height:24px;object-fit:contain;display:block}
/* overzicht: competitiekaarten, spelerspagina, voortgang */
.cc{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 14px 22px;margin-bottom:10px;position:relative;overflow:hidden;color:var(--ink);cursor:pointer;font:inherit}
.cc::before,.chead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc,var(--top))}
.cc:hover{box-shadow:0 2px 4px rgba(11,29,68,.1),0 6px 18px rgba(11,29,68,.08)}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu);font-weight:600;flex-wrap:wrap}
.cc-name{display:block;font:700 22px/1.15 var(--fd);margin:4px 0 6px;overflow-wrap:anywhere}
.cc-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cc-pos{font:800 36px/1 var(--fd);color:var(--gc,var(--act))}
.cc-pos small{display:inline;font:600 14px var(--fb);color:var(--mu);margin-left:5px}
.cc-stat{font-size:14px;color:var(--mu)}
.prog{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:var(--gc,var(--top));border-radius:99px}
.cc-foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--gc,var(--act))}
.mini{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.mini div{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.mini b{font-variant-numeric:tabular-nums;margin-left:auto;font-weight:700;color:var(--mu)}
.chead{position:relative;overflow:hidden;padding:14px 16px 14px 22px}
.chn{font:800 32px/1.05 var(--fd);margin:6px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gt{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;border-top:5px solid var(--gc);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer;color:var(--ink);font:inherit}
.gt b{font:700 19px var(--fd)}
.gt .bd,.li .bd{align-self:flex-start;width:max-content}
.gt span.st{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.tchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:3px 11px 3px 3px;font-size:14px;font-weight:600;border:0;color:var(--ink);cursor:pointer;font-family:inherit}
.dayh{font:700 15px var(--fb);color:var(--mu);margin:18px 4px 8px;text-transform:capitalize}
.dayh:first-of-type{margin-top:4px}

// ---- schema's (afgeleid van teams, alleen scores worden opgeslagen)
function leagueFix(c){
 const ts=[...c.teams];if(ts.length%2)ts.push(null);const m=ts.length,out=[];
 for(let rep=0;rep<(c.x||1);rep++){let arr=[...ts];
  for(let r=0;r<m-1;r++){const rd=[];
   for(let i=0;i<m/2;i++){let a=arr[i],b=arr[m-1-i];if(!a||!b)continue;if(rep%2)[a,b]=[b,a];rd.push({key:`${rep}-${r}-${i}`,a,b})}
   out.push({label:"Ronde "+(rep*(m-1)+r+1),games:rd});
   arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];}}
 return out;
}
function koRounds(c){
 const n=c.teams.length;let S=2;while(S<n)S*=2;
 let order=[1];while(order.length<S){const L=order.length*2;order=order.flatMap(x=>[x,L+1-x])}
 let ent=order.map(s=>c.teams[s-1]||null),rounds=[],r=0,total=Math.log2(S);
 while(ent.length>1){const games=[],next=[];
  for(let i=0;i<ent.length;i+=2){const a=ent[i],b=ent[i+1],key=`k${r}-${i/2}`,sc=(c.scores||{})[key];let w=null;
   if(a&&!b)w=a;else if(b&&!a)w=b;else if(a&&b&&sc&&sc[0]!==sc[1])w=sc[0]>sc[1]?a:b;
   games.push({key,a,b,w,bye:!!(a&&!b||b&&!a)});next.push(w)}
  const left=total-r;rounds.push({label:left===1?"Finale":left===2?"Halve finale":left===3?"Kwartfinale":"Ronde "+(r+1),games});ent=next;r++}
 return {rounds,champ:ent[0]};
}
function progress(c){const sc=Object.keys(c.scores||{}).length;if(c.type==="league")return sc+"/"+leagueFix(c).reduce((s,r)=>s+r.games.length,0);return sc+"/"+Math.max(0,c.teams.length-1)}
function allGames(c){return c.type==="league"?leagueFix(c).flatMap(r=>r.games.map(g=>({...g,label:r.label}))):koRounds(c).rounds.flatMap(r=>r.games.filter(g=>!g.bye&&g.a&&g.b).map(g=>({...g,label:r.label})))}
function allRes(ms=matches,cs=comps){const out=ms.map(m=>({...m,kind:"m",t:m.t||m.n}));
 cs.forEach(c=>{const meta=c.meta||{},gs=allGames(c);Object.entries(c.scores||{}).forEach(([key,sc])=>{const g=gs.find(x=>x.key===key);if(!g)return;const mt=meta[key]||{};out.push({kind:"c",c,key,label:g.label,a:g.a,b:g.b,sa:sc[0],sb:sc[1],t:mt.t||c.created||0,info:mt.info||"",ref:mt.ref||"",mode:mt.mode||"",sub:mt.sub||"",ta:mt.ta||"",tb:mt.tb||"",legs:mt.legs||null})})});
 return out}

function ratings(){
 if(RTC)return RTC;
 const G=allRes().map(m=>{const t=m.sa+m.sb;return{a:m.a,b:m.b,v:t?(Math.sign(m.sa-m.sb)+(m.sa-m.sb)/t)/2:0}});
 const T=[...new Set(G.flatMap(g=>[g.a,g.b]))],r={};T.forEach(n=>r[n]=0);
 for(let it=0;it<300;it++){const nr={};
  T.forEach(n=>{let sum=0,c=0;G.forEach(g=>{if(g.a===n){sum+=g.v+r[g.b];c++}else if(g.b===n){sum+=-g.v+r[g.a];c++}});nr[n]=sum/(c+1)});
  T.forEach(n=>r[n]=nr[n])}
 const R={};T.forEach(n=>R[n]=1500+300*r[n]);return RTC=R}
function rating(n){const R=ratings();return Math.round(R[n]===undefined?1500:R[n])}
function oddsHtml(a,b){
 const R=ratings(),ra=R[a]===undefined?1500:R[a],rb=R[b]===undefined?1500:R[b],all=allRes(),cnt=n=>all.filter(m=>m.a===n||m.b===n).length;
 const p=Math.min(.9,Math.max(.1,1/(1+Math.exp((rb-ra)/220)))),q=1-p,low=Math.min(cnt(a),cnt(b))<2;
 return `<div class="ob" aria-hidden="true"><i style="width:${Math.round(p*100)}%"></i><em style="width:${Math.round(q*100)}%"></em></div><div class="odds"><span><b>${(1/p).toFixed(2)}</b> · ${Math.round(p*100)}%</span><span>${Math.round(q*100)}% · <b>${(1/q).toFixed(2)}</b></span></div>${low?'<div class="inf">Weinig data over een van de twee, de odds zijn nog onzeker</div>':""}`;
}

// ---- ranks
const RK=[{n:"Brons",i:"🥉",c:"#cd7f32"},{n:"Zilver",i:"🥈",c:"#8e99a6"},{n:"Goud",i:"🥇",c:"#d99a00"},{n:"Diamond",i:"💎",c:"#0ea5e9"}];

function duels(c){const P={};leagueFix(c).forEach(r=>r.games.forEach(g=>{const[x,y]=[g.a,g.b].sort(),k=x+"\u0000"+y,d=P[k]=P[k]||{x,y,gx:0,gy:0,n:0,done:0};d.n++;const sc=(c.scores||{})[g.key];if(sc){d.done++;if(g.a===x){d.gx+=sc[0];d.gy+=sc[1]}else{d.gx+=sc[1];d.gy+=sc[0]}}}));return Object.values(P)}
function pointRows(c){
 if(!duelMode(c)){const all=[];leagueFix(c).forEach(r=>r.games.forEach(g=>{const sc=(c.scores||{})[g.key];if(sc)all.push({a:g.a,b:g.b,sa:sc[0],sb:sc[1]})}));const t=rec(all);

 duels(c).forEach(d=>{const X=t[d.x],Y=t[d.y];if(!X||!Y)return;X.vo+=d.gx;X.te+=d.gy;Y.vo+=d.gy;Y.te+=d.gx;if(d.done<d.n)return;X.g++;Y.g++;

 return Object.values(t).sort((a,b)=>b.p-a.p||(b.vo-b.te)-(a.vo-a.te)||b.vo-a.vo)}
function duelsHtml(c){const D=duels(c);if(!D.length||(c.x||1)<2)return "";
 return `<div class="sec">Duels (${c.x} wedstrijden tegen elkaar, totaal telt)</div>`+D.map(d=>{const st=d.done===0?"Nog niet begonnen":d.done<d.n?(d.gx===d.gy?"Gelijk":(d.gx>d.gy?d.x:d.y)+" staat voor")+` · nog ${d.n-d.done} wedstrijd${d.n-d.done===1?"":"en"}`:d.gx===d.gy?"Gelijk · allebei 1 punt":(d.gx>d.gy?d.x:d.y)+" wint · 3 punten";
  return `<div class="m"><div class="mr"><div class="t ${d.done===d.n&&d.gx>d.gy?"w":""}">${crest(d.x,30)}<span>${esc(d.x)}</span></div><div class="sc ${d.done?"":"o"}">${d.done?d.gx+" – "+d.gy:"– : –"}</div><div class="t r ${d.done===d.n&&d.gy>d.gx?"w":""}">${crest(d.y,30)}<span>${esc(d.y)}</span></div></div><div class="mm"><span>${esc(st)}</span><span>${d.done}/${d.n} gespeeld</span></div></div>`}).join("")}
function standRows(c){if(usesPoints(c))return pointRows(c);const all=[];leagueFix(c).forEach(r=>r.games.forEach(g=>{const sc=(c.scores||{})[g.key];if(sc)all.push({a:g.a,b:g.b,sa:sc[0],sb:sc[1]})}));const t=rec(all);c.teams.forEach(n=>{if(!t[n])t[n]={n,g:0,w:0,v:0,d:0,vo:0,te:0}});return Object.values(t).sort((x,y)=>y.w-x.w||(y.vo-y.te)-(x.vo-x.te)||y.vo-x.vo)}
function finalPlaces(c){
 if(c.type==="league")return standRows(c).map((r,i)=>({name:r.n,place:i+1}));
 const k=koRounds(c);if(!k.champ)return null;
 const place={};place[k.champ]=1;const R=k.rounds.length;
 k.rounds.forEach((rd,ri)=>rd.games.forEach(g=>{if(!g.a||!g.b||!g.w)return;const l=g.w===g.a?g.b:g.a;if(place[l]===undefined)place[l]=ri===R-1?2:ri===R-2?3:4}));
 c.teams.forEach(n=>{if(place[n]===undefined)place[n]=4});
 return Object.entries(place).map(([name,p])=>({name,place:p})).sort((a,b)=>a.place-b.place||a.name.localeCompare(b.name))}

// ---- overzicht-hulpjes
function cg(c){return c.game||"zonderbord"}
function jsq(n){return JSON.stringify(String(n)).replace(/"/g,"&quot;")}
function pNums(c){const d=Object.keys(c.scores||{}).length,t=c.type==="league"?leagueFix(c).reduce((x,r)=>x+r.games.length,0):Math.max(1,(c.teams||[]).length-1);return{d,t,pct:Math.round(100*Math.min(1,t?d/t:0))}}
function same(a,b){return pkey(a)===pkey(b)}
function placeOf(c,n){if(c.type!=="league")return null;const R=standRows(c),i=R.findIndex(r=>same(r.n,n));return i<0?null:{i:i+1,of:R.length,r:R[i]}}
function nextFor(c,n){return allGames(c).find(g=>!(c.scores||{})[g.key]&&(same(g.a,n)||same(g.b,n)))}
function leaderLine(c){if(c.type==="league"){if(!Object.keys(c.scores||{}).length)return "Nog niets gespeeld";const r=standRows(c)[0];return (isDone(c)?"Winnaar: ":"Bovenaan: ")+r.n}const k=koRounds(c);return k.champ?"Winnaar: "+k.champ:"Knock-out bezig"}
function compBig(c,who){
 const g=cg(c),P=pNums(c);let mid="";
 if(who){const me=(c.teams||[]).find(x=>same(x,who))||who;
  if(c.type==="league"){const q=placeOf(c,me);mid=q?`<div class="cc-row"><span class="cc-pos">${q.i}e<small>van ${q.of}</small></span><span class="cc-stat">${usesPoints(c)?`<b>${q.r.p}</b> punten · `:""}${q.r.w} gewonnen · ${q.r.v} verloren</span></div>`:""}
  else mid=`<div class="cc-row"><span class="cc-pos" style="font-size:24px">${esc(koStatus(c,me)||"Bezig")}</span></div>`;
  const nx=nextFor(c,me);if(nx)mid+=`<div class="inf">Volgende wedstrijd: tegen <b>${esc(same(nx.a,me)?nx.b:nx.a)}</b> · ${esc(nx.label)}</div>`}
 else if(c.type==="league"&&Object.keys(c.scores||{}).length)mid=`<div class="mini">${standRows(c).slice(0,3).map((r,i)=>`<div><span class="rank ${rk(i)}">${i+1}</span>${crest(r.n,24)}<span>${esc(r.n)}</span><b>${usesPoints(c)?r.p+" pnt":r.w+" gew."}</b></div>`).join("")}</div>`;
 else mid=`<div class="inf" style="margin-top:0">${esc(leaderLine(c))}</div>`;
 return `<button class="cc" style="--gc:${GM[g].c}" onclick="openCompIn('${g}','${c.id}')"><div class="cc-top"><span class="gchip">${GM[g].e} ${GM[g].n}</span><span>${c.type==="league"?"Competitie":"Knock-out"} · ${modeChip(c)}</span></div><span class="cc-name">${esc(c.name)}</span>${mid}<div class="prog" aria-hidden="true"><i style="width:${P.pct}%"></i></div><div class="cc-foot"><span>${P.d} van ${P.t} gespeeld</span><span>${isDone(c)?"Afgelopen 🏁":"Bezig"}</span></div></button>`}
function dayLabel(t){if(!t||t<1e11)return "Eerder";const d=new Date(t),n=new Date(),y=new Date();y.setDate(n.getDate()-1);const k=x=>x.toDateString();return k(d)===k(n)?"Vandaag":k(d)===k(y)?"Gisteren":d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})}
function gameStats(g,n){const f=x=>cg(x)===g,res=allRes(RAWM.filter(f),RAWC.filter(f)).filter(m=>same(m.a,n)||same(m.b,n));let w=0,v=0,d=0;res.forEach(m=>{const me=same(m.a,n),a=me?m.sa:m.sb,b=me?m.sb:m.sa;if(a>b)w++;else if(a<b)v++;else d++});return{res:res.map(m=>({...m,g})),w,v,d}}
function personDetail(n){
 if(!n)return pageTitle("Speler niet gevonden","goBack()");
 const pr=PN[pkey(n)]||{id:null,name:n,photo:(TM[n]&&TM[n].logo)||""},TT=pr.id?teamsOf(pr.id):[];

 const C=RAWC.filter(c=>(c.teams||[]).some(x=>same(x,n))),act=C.filter(c=>!isDone(c)).sort((a,b)=>doneAt(b)-doneAt(a)),fin=C.filter(isDone).sort((a,b)=>doneAt(b)-doneAt(a));
 const G=Object.keys(GM),S={};G.forEach(g=>S[g]=gameStats(g,n));
 const all=G.flatMap(g=>S[g].res).sort((a,b)=>b.t-a.t),W=G.reduce((x,g)=>x+S[g].w,0),V=G.reduce((x,g)=>x+S[g].v,0);
 let h=`<button class="back" onclick="goBack()">${IC.back} Terug</button>`;

 h+=`<div class="pstats"><div class="stat"><b>${all.length}</b><span>gespeeld</span></div><div class="stat"><b>${W}</b><span>gewonnen</span></div><div class="stat"><b>${V}</b><span>verloren</span></div><div class="stat"><b>${act.length}</b><span>bezig</span></div></div>`;
 h+=`<div class="sec">Nu bezig</div>`+(act.length?act.map(c=>compBig(c,n)).join(""):`<div class="card empty">Doet nu niet mee aan een competitie.</div>`);
 h+=`<div class="sec">Per spel</div><div class="gtiles">${G.map(g=>{const x=S[g];return `<div class="gt" style="--gc:${GM[g].c}"><b>${GM[g].e} ${GM[g].n}</b>${rankBadge(rankOf(g,n))}<span class="st">${x.res.length} gespeeld · ${x.w} W · ${x.v} V${x.d?" · "+x.d+" G":""}</span></div>`}).join("")}</div>`;
 if(fin.length)h+=`<div class="sec">Afgelopen competities</div>`+fin.map(c=>{const g=cg(c),fp=(finalPlaces(c)||[]).find(x=>same(x.name,n));return `<button class="li" style="margin-bottom:8px" onclick="openCompIn('${g}','${c.id}')">${fp?`<span class="rank ${rk(fp.place-1)}">${fp.place}</span>`:""}<div><b>${esc(c.name)}</b><span>${GM[g].e} ${GM[g].n} · ${fp?fp.place+"e plek":"afgelopen"}</span>${c.ranked&&fp?`<span style="display:block;margin-top:4px">${rankBadge(placeRank(fp.place))}</span>`:""}</div>${IC.chev}</button>`}).join("");
 h+=`<div class="sec">Laatste uitslagen</div>`+(all.length?all.slice(0,8).map(m=>{const me=same(m.a,n),a=me?m.sa:m.sb,b=me?m.sb:m.sa,r=a>b?"W":a<b?"V":"G",opp=me?m.b:m.a;return `<div class="lr"><span class="pill ${r}">${r}</span><span class="gdot" style="background:${GM[m.g].c}" title="${GM[m.g].n}"></span><span class="who">tegen <b>${esc(opp)}</b><small class="inf" style="margin:0">${GM[m.g].n} · ${m.kind==="c"?esc(m.c.name):"Vriendschappelijk"}</small></span><span class="scr">${a} – ${b}</span></div>`}).join(""):`<div class="card empty">Nog geen wedstrijden gespeeld.</div>`);
 if(isMe)h+=`<div class="acts"><button class="ic" onclick="go('me');mdraft={name:PM[myPid()].name,photo:PM[myPid()].photo||''};render()">✎ Bewerk mijn speler</button><button class="ic" onclick="go('me')">👑 Mijn team</button></div>`;
 else if(admin&&canWrite&&pr.id)h+=`<div class="acts"><button class="ic" onclick="editPlayerDraft('${pr.id}')">✎ Bewerk speler</button><button class="ic" onclick="delPlayer('${pr.id}')">🗑 Verwijder speler</button></div>`;
 return h}

let CR=null;const ZMAX=6;
function cropImage(file,o){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>startCrop(img,o,res);img.src=r.result};r.readAsDataURL(file)})}
function startCrop(img,o,res){
 const m=$("#crop"),vp=$("#cropVp"),el=$("#cropImg");
 vp.classList.toggle("round",!!o.round);$("#cropTitle").textContent=o.round?"Foto bijsnijden":"Logo bijsnijden";
 m.hidden=false;vp.style.height=(vp.clientWidth||300)+"px";el.src=img.src;
 const V=vp.clientWidth||300,w=img.naturalWidth,h=img.naturalHeight,minS=o.round?Math.max(V/w,V/h):Math.min(V/w,V/h);
 CR={img,o,res,V,w,h,minS,s:minS,x:(V-w*minS)/2,y:(V-h*minS)/2,P:new Map()};
 $("#cropZoom").value=0;cropDraw();setTimeout(()=>$("#cropZoom").focus(),30);
}
function cropClamp(){const{V,w,h,s}=CR,W=w*s,H=h*s;
 CR.x=W>=V?Math.min(0,Math.max(V-W,CR.x)):Math.max(0,Math.min(V-W,CR.x));
 CR.y=H>=V?Math.min(0,Math.max(V-H,CR.y)):Math.max(0,Math.min(V-H,CR.y))}
function cropDraw(){cropClamp();const el=$("#cropImg");el.style.width=CR.w*CR.s+"px";el.style.height=CR.h*CR.s+"px";el.style.transform=`translate(${CR.x}px,${CR.y}px)`}
function cropScale(ns,px,py){if(!CR)return;ns=Math.max(CR.minS,Math.min(CR.minS*ZMAX,ns));const cx=(px-CR.x)/CR.s,cy=(py-CR.y)/CR.s;CR.s=ns;CR.x=px-cx*ns;CR.y=py-cy*ns;$("#cropZoom").value=Math.round(100*Math.log(ns/CR.minS)/Math.log(ZMAX));cropDraw()}
function cropZoomTo(v){if(CR)cropScale(CR.minS*Math.pow(ZMAX,v/100),CR.V/2,CR.V/2)}
function cropPt(e){const r=$("#cropVp").getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function cropDone(){if(!CR)return;const{o,img,V}=CR,N=o.size,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d"),k=N/V;
 if(o.round){x.fillStyle="#fff";x.fillRect(0,0,N,N)}x.imageSmoothingQuality="high";x.drawImage(img,CR.x*k,CR.y*k,CR.w*CR.s*k,CR.h*CR.s*k);
 let u;if(o.round)u=c.toDataURL("image/jpeg",.85);else{u=c.toDataURL("image/webp",.85);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/png")}
 const r=CR.res;cropClose();r(u)}
function cropCancel(){const r=CR&&CR.res;cropClose();if(r)r(null)}
function cropClose(){$("#crop").hidden=true;$("#cropImg").removeAttribute("src");CR=null}
(function(){const vp=$("#cropVp");
 vp.addEventListener("pointerdown",e=>{if(!CR)return;vp.setPointerCapture(e.pointerId);CR.P.set(e.pointerId,cropPt(e));e.preventDefault()});
 vp.addEventListener("pointermove",e=>{if(!CR||!CR.P.has(e.pointerId))return;const pt=cropPt(e),prev=CR.P.get(e.pointerId);
  if(CR.P.size===1){CR.x+=pt.x-prev.x;CR.y+=pt.y-prev.y;CR.P.set(e.pointerId,pt);cropDraw();return}
  const ids=[...CR.P.keys()],other=CR.P.get(ids.find(i=>i!==e.pointerId)),d0=Math.hypot(prev.x-other.x,prev.y-other.y),d1=Math.hypot(pt.x-other.x,pt.y-other.y);
  CR.P.set(e.pointerId,pt);if(d0>0)cropScale(CR.s*d1/d0,(pt.x+other.x)/2,(pt.y+other.y)/2)});
 const up=e=>{if(CR)CR.P.delete(e.pointerId)};vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
 vp.addEventListener("wheel",e=>{if(!CR)return;e.preventDefault();const pt=cropPt(e);cropScale(CR.s*Math.exp(-e.deltaY*.0015),pt.x,pt.y)},{passive:false});
 document.addEventListener("keydown",e=>{if(!CR)return;if(e.key==="Escape")cropCancel();else if(e.key==="Enter"&&e.target.tagName!=="BUTTON")cropDone()});
})();
function shrink(file,size,keepWhole){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d"),w=img.naturalWidth,h=img.naturalHeight;
  if(keepWhole){const k=Math.min(size/w,size/h),dw=w*k,dh=h*k;x.drawImage(img,(size-dw)/2,(size-dh)/2,dw,dh);
   let u=c.toDataURL("image/webp",.85);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/png");res(u)}
  else{const m=Math.min(w,h);x.fillStyle="#fff";x.fillRect(0,0,size,size);x.drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,size,size);res(c.toDataURL("image/jpeg",.82))}
 };img.src=r.result};r.readAsDataURL(file)})}

 if(d.isNew&&RAWP.some(x=>pkey(x.name)===pkey(name))){alert("Die speler bestaat al");return}
 const pid=d.id||"p"+Date.now(),old=PM[pid],em=normEmail(d.email),oldEm=EMBY[pid]||"";
 if(emailsOn()){if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Dit e-mailadres klopt niet");return}
  if(em&&EMAIL[em]&&EMAIL[em]!==pid&&PM[EMAIL[em]]){alert("Dit e-mailadres hoort al bij "+PM[EMAIL[em]].name);return}}
 const eh=HASHLINK&&emailsOn()?{eh:em?await hashEmail(em):""}:{};
 if(!await put("players",pid,{...(old?strip(old):{created:Date.now()}),name,photo:d.photo||"",...eh}))return;
 if(emailsOn()&&em!==oldEm){try{if(oldEm)await db.collection("emails").doc(oldEm).delete();if(em)await db.collection("emails").doc(em).set({pid})}catch(e){alert("De speler is opgeslagen, maar het e-mailadres niet");return}}

 pdraft=null;alert("Opgeslagen");render();
}

async function saveResult(){
 const g=id=>($(id)?$(id).value.trim():""),info=g("#info"),ref=g("#ref"),mode=g("#mode"),sub=g("#sub"),rc=g("#rc"),ta=g("#ta"),tb=g("#tb");
 let sa=+g("#sa")||0,sb=+g("#sb")||0,legs=null;
 if(LEGS()>1){const a2=+g("#sa2")||0,b2=+g("#sb2")||0;legs=[{a:sa,b:sb},{a:a2,b:b2}];sa+=a2;sb+=b2}
 if(MAXP()&&(sa>MAXP()||sb>MAXP())){alert("Maximaal "+MAXP()+" "+U().toLowerCase()+" per team");return}
 if(!rc){const a=g("#a"),b=g("#b");if(!a||!b||a===b){alert("Vul twee verschillende "+GM[game].u+" in");return}
  const old=editM&&matches.find(x=>x.id===editM),n=old?old.n:matches.reduce((m,x)=>Math.max(m,x.n||0),0)+1;
  if(await put("matches",old?old.id:"m"+Date.now(),{n,t:old?(old.t||old.n):Date.now(),mode,sub,a,b,sa,sb,legs,type:old?old.type:"Vriendschappelijk",ref,info,ta,tb})){alert("Opgeslagen");go("results")}
  return}
 const c=comps.find(x=>x.id===rc),key=g("#rg");if(!c||!key){alert("Kies een wedstrijd");return}
 if(c.type==="knockout"&&sa===sb){alert(legs?"Gelijk over de 2 wedstrijden. Bij knock-out moet er een winnaar zijn":"Bij knock-out is geen gelijkspel mogelijk");return}
 if(await storeScore(c,key,sa,sb,{info,ref,mode,sub,ta,tb,legs})){alert("Opgeslagen");go("results")}
}
function pruneLater(rest,key){const[r,i]=key.slice(1).split("-").map(Number);
 Object.keys(rest.scores).forEach(k=>{const[r2,i2]=k.slice(1).split("-").map(Number);if(r2>r&&i2===Math.floor(i/2**(r2-r))){delete rest.scores[k];delete rest.meta[k]}})}
async function storeScore(c,key,sa,sb,m){
 const{id,...rest}=c;rest.scores={...(c.scores||{})};rest.meta={...(c.meta||{})};
 const old=rest.scores[key];if(c.type==="knockout"&&old&&(old[0]>old[1])!==(sa>sb))pruneLater(rest,key);
 rest.scores[key]=[sa,sb];rest.meta[key]={...m,t:(rest.meta[key]||{}).t||Date.now()};
 return put("comps",c.id,rest);
}
async function saveScore(cid,key,ko){
 const c=comps.find(x=>x.id===cid),mt=(c.meta||{})[key]||{};let a=$("#a_"+key).value,b=$("#b_"+key).value,legs=null;
 if(MAXP()&&(+a>MAXP()||+b>MAXP())){alert("Maximaal "+MAXP()+" "+U().toLowerCase()+" per team");return}
 if(a===""||b===""){alert("Vul beide scores in");return}
 if(LEGS()>1){const a2=$("#a2_"+key).value,b2=$("#b2_"+key).value;if(a2===""||b2===""){alert("Vul ook de 2e wedstrijd in");return}legs=[{a:+a,b:+b},{a:+a2,b:+b2}];a=+a+(+a2);b=+b+(+b2)}
 if(ko&&+a===+b){alert(legs?"Gelijk over de 2 wedstrijden. Bij knock-out moet er een winnaar zijn":"Bij knock-out is geen gelijkspel mogelijk");return}
 if(await storeScore(c,key,+a,+b,{...mt,legs,info:$("#i_"+key).value.trim(),ta:$("#ca_"+key)?$("#ca_"+key).value.trim():mt.ta||"",tb:$("#cb_"+key)?$("#cb_"+key).value.trim():mt.tb||""}))alert("Opgeslagen");
}

async function saveComp(){

 const type=$("#ct").value,x=type==="league"?+$("#cx").value:1;
 if(old)ts=[...old.teams.filter(n=>ts.includes(n)),...ts.filter(n=>!old.teams.includes(n))];
 else if(type==="knockout")ts.sort(()=>Math.random()-.5);
 const same=old&&old.type===type&&old.x===x&&JSON.stringify(old.teams)===JSON.stringify(ts);
 const id=old?old.id:"c"+Date.now(),ranked=$("#cmode").value==="1";
 if(await put("comps",id,{name,type,x,ranked,teams:ts,scores:same?old.scores||{}:{},meta:same?old.meta||{}:{},created:old?old.created:Date.now()})){editC=null;newTid="";openComp(id)}
}
async function delTeam(i){
 const n=names()[i];if(!n||!admin||!canWrite)return;
 const ms=matches.filter(m=>m.a===n||m.b===n),cs=comps.filter(c=>c.teams.includes(n));
 if(pend!=="t"+n){pend="t"+n;alert(`Tik nog een keer: ${n} verdwijnt (bij alle spellen), met ${ms.length} losse uitslagen, en uit ${cs.length} competities (die uitslagen worden gewist)`);setTimeout(()=>{pend=null},5000);return}
 pend=null;
 try{
  for(const m of ms)await db.collection("matches").doc(m.id).delete();
  for(const t of teams.filter(t=>t.name===n))await db.collection("teams").doc(t.id).delete();
  for(const c of cs){const ts=c.teams.filter(x=>x!==n);
   if(ts.length<2){await db.collection("comps").doc(c.id).delete();continue}
   const{id,...rest}=c;rest.teams=ts;rest.scores={};rest.meta={};await db.collection("comps").doc(c.id).set(rest)}
  alert("Verwijderd");go("teams");
 }catch(e){alert("Verwijderen mislukt")}
}
async function delDoc(col,id){
 if(!admin||!canWrite)return;
 if(pend!==col+id){pend=col+id;alert("Tik nog een keer om te verwijderen");setTimeout(()=>{pend=null},4000);return}
 pend=null;
 try{await db.collection(col).doc(id).delete();alert("Verwijderd");if(col==="comps"||col==="tourns")go("comps")}catch(e){alert("Verwijderen mislukt")}
}

applyGame();render();
(function(){
 if(!window.firebase){alert("Kon Firebase niet laden, check je internet");return}
 firebase.initializeApp(firebaseConfig);
 db=firebase.firestore();live=true;
 firebase.auth().onAuthStateChanged(u=>{admin=canWrite=!!u&&u.email===ADMIN_EMAIL;ME=null;watchEmails(admin);if(u&&!admin)linkMe(u);else render()});
 firebase.auth().getRedirectResult().catch(()=>{});
 const sub=(c,f)=>db.collection(c).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));applyGame();render()},e=>console.error(c,e));
 sub("matches",x=>RAWM=x);sub("teams",x=>RAWT=x);sub("tourns",x=>RAWTO=x);sub("comps",x=>RAWC=x);sub("players",x=>RAWP=x);
 render();
})();
</script>
